name: Portfolio structure and integrity checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate CSV structure and content
        run: python scripts/validate_portfolio.py --require-source
      - name: Validate cross-register integrity
        run: python scripts/validate_relationships.py
